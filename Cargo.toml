[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/heretic-tech/surf"
authors = ["heretic-tech"]
rust-version = "1.85"

[workspace.dependencies]
# internal crates
surf-syntax = { path = "crates/surf-syntax", version = "0.1.0" }
surf-vm = { path = "crates/surf-vm", version = "0.1.0" }
surf-cdp = { path = "crates/surf-cdp", version = "0.1.0" }
surf-browser = { path = "crates/surf-browser", version = "0.1.0" }
surf-runtime = { path = "crates/surf-runtime", version = "0.1.0" }
surf-testserver = { path = "crates/surf-testserver", version = "0.1.0" }

# async runtime (surf-cdp / surf-browser / surf-runtime / surf-cli only — never surf-syntax / surf-vm)
tokio = { version = "1.53.2", features = ["rt", "macros", "io-util", "net", "process", "sync", "time", "fs", "signal"] }
futures = "0.3.34"

# serialisation
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
indexmap = { version = "2.14.2", features = ["serde"] }

# transports
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

# errors / diagnostics / logging
thiserror = "2.0.21"
ariadne = "0.6.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# cli / utilities
clap = { version = "4.6.7", features = ["derive", "env"] }
tempfile = "3.27.0"
regex = "1.13.1"
dirs = "7.0.0"

# platform
libc = "0.2.190"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Security"] }

# dev
insta = { version = "1.49.0", features = ["yaml"] }
axum = "0.8.9"
similar = "2.7.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# panic stays "unwind" (default): VM errors are values, but we keep unwinding
# so a panicking task cannot take the whole process down without a trace.

[profile.dev]
debug = 1
