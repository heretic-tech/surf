<!doctype html>
<html>
<head><meta charset="utf-8"><title>Shadow fixture</title></head>
<body>
  <p id="light">light text</p>
  <div id="host"></div>
  <div id="closed-host"></div>
  <form id="special">
    <input id="date" type="date">
    <input id="number" type="number" min="0" max="10">
    <input id="color" type="color">
    <input id="file" type="file" multiple>
    <div id="files"></div>
  </form>
  <script>
    const host = document.getElementById('host');
    const root = host.attachShadow({ mode: 'open' });
    root.innerHTML = '<style>.inner{padding:4px}</style><button class="inner" id="shadow-btn">shadow button</button><p class="inner">deep <span>shadow text</span></p><div id="nested"></div><slot></slot>';
    host.innerHTML = '<em id="slotted">slotted text</em>';
    const nested = root.getElementById('nested').attachShadow({ mode: 'open' });
    nested.innerHTML = '<i class="inner">nested text</i>';
    root.getElementById('shadow-btn').addEventListener('click', () => { document.getElementById('light').textContent = 'shadow clicked'; });
    document.getElementById('closed-host').attachShadow({ mode: 'closed' }).innerHTML = '<b class="secret">closed text</b>';
    document.getElementById('file').addEventListener('change', (e) => {
      document.getElementById('files').textContent = Array.from(e.target.files).map(f => f.name + ':' + f.size).join(',');
    });
  </script>
</body>
</html>
