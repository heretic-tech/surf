[package]
name = "surf-cli"
description = "The `surf` command: run, check, doctor, repl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "surf"
path = "src/main.rs"

# The end-to-end suite lives at the workspace root (`tests/e2e/`) so the
# scripts sit next to the runner; `cargo test --test e2e` runs it.
[[test]]
name = "e2e"
path = "../../tests/e2e/main.rs"

[dependencies]
surf-syntax = { workspace = true }
surf-vm = { workspace = true }
surf-cdp = { workspace = true }
surf-browser = { workspace = true }
surf-runtime = { workspace = true }
tokio = { workspace = true, features = ["io-std"] }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
surf-testserver = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
regex = { workspace = true }
similar = { workspace = true }
