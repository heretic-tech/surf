name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p surf-syntax -p surf-vm --target wasm32-unknown-unknown

  # Chrome-needing jobs use the stock Google Chrome stable that ships on the
  # hosted runner images (the platform defaults `surf_browser::discovery`
  # tries), pinned through SURF_CHROME so a missing binary is an error, not
  # a skip. Not browser-actions/setup-chrome: its "stable" is Chrome for
  # Testing, which (1) on Linux ships a non-setuid chrome-sandbox and aborts
  # at startup under ubuntu-24.04's AppArmor userns restriction, (2) on
  # macOS is cached without the `.app` wrapper, so every child process dies
  # at the Mach-port rendezvous (`bootstrap_look_up … Permission denied`)
  # and renderer-side CDP (`Page.getFrameTree`) never answers, and (3) in
  # headed mode shows its own permanent disclaimer infobar, which the
  # no-infobar launch test cannot tell from the automation one.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            chrome: /opt/google/chrome/chrome
          - os: macos-latest
            chrome: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    runs-on: ${{ matrix.os }}
    env:
      SURF_CHROME: ${{ matrix.chrome }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Chrome version
        run: '"$SURF_CHROME" --version'
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: cargo test (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace
      - name: cargo test (macOS)
        if: runner.os == 'macOS'
        run: cargo test --workspace

  e2e:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            chrome: /opt/google/chrome/chrome
          - os: macos-latest
            chrome: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    runs-on: ${{ matrix.os }}
    env:
      SURF_CHROME: ${{ matrix.chrome }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Chrome version
        run: '"$SURF_CHROME" --version'
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: e2e (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test -p surf-cli --test e2e -- --nocapture
      - name: e2e (macOS)
        if: runner.os == 'macOS'
        run: cargo test -p surf-cli --test e2e -- --nocapture

  # Performance gates (tests/perf.rs) on a release build. Reported, not yet
  # blocking: the budgets were set on a developer Mac (docs/quiet-cdp.md
  # §5) and the shared runners' numbers are unknown until this has run a
  # while — see TASKS.md.
  perf:
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            chrome: /opt/google/chrome/chrome
          - os: macos-latest
            chrome: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    env:
      SURF_CHROME: ${{ matrix.chrome }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Chrome version
        run: '"$SURF_CHROME" --version'
      - name: perf gates (release)
        run: cargo test --release -p surf-cli --test perf -- --nocapture --test-threads=1
